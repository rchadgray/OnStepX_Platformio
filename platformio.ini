[platformio]
src_dir = src
default_envs = esp32

[env]
framework = arduino
monitor_speed = 115200

[env:esp32]
platform = espressif32@6.8.1
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
extra_scripts = post:merge_bin.py
lib_deps = 
  madhephaestus/ESP32Encoder @ ^0.11.8
  plerup/EspSoftwareSerial @ ^8.1.0

[env:teensy32]
platform = teensy
board = teensy31
lib_ignore =
  NativeEthernet
  FNET
  ESP32Encoder-master
build_src_filter =
  +<*> # Include all source files by default
  -<../lib/ESP32Encoder-master/> # Exclude the ESP32-specific encoder library
  +<../lib/Ethernet-master/> # Teensy 3.2 uses standard Ethernet
  -<../lib/NativeEthernet/> # Exclude NativeEthernet (Teensy 4.1 only)
  +<../lib/FlexCAN_T4/>     # Explicitly include Teensy CAN library

[env:teensy41]
platform = teensy
board = teensy41
lib_ignore =
  Ethernet
  Ethernet-master
  ESP32Encoder-master
build_src_filter =
  +<*> # Include all source files by default
  -<../lib/ESP32Encoder-master/> # Exclude the ESP32-specific encoder library
  -<../lib/Ethernet-master/> # Teensy uses NativeEthernet, not this one
  +<../lib/NativeEthernet/> # Explicitly include Teensy ethernet
  +<../lib/FlexCAN_T4/>     # Explicitly include Teensy CAN library
