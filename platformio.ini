[platformio]
src_dir = src
default_envs = esp32

[env]
framework = arduino
monitor_speed = 115200

[env:esp32]
platform = espressif32@6.8.1
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560

[env:teensy41]
platform = teensy
board = teensy41
