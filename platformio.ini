[platformio]
src_dir = src
default_envs = esp32

[env]
framework = arduino
monitor_speed = 115200

[env:esp32]
platform = espressif32@6.8.1
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
extra_scripts = post:merge_bin.py
lib_deps = madhephaestus/ESP32Encoder @ ^0.11.8

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560

[env:teensy41]
platform = teensy
board = teensy41
build_src_filter =
  +<*> # Include all source files by default
  -<../lib/ESP32Encoder-master/> # Exclude the ESP32-specific encoder library
  -<../lib/TMC2209-main/> # This might also be ESP32 specific, excluding just in case
  -<../lib/Ethernet-master/> # Teensy uses NativeEthernet, not this one
  +<../lib/NativeEthernet/> # Explicitly include Teensy ethernet
  +<../lib/FlexCAN_T4/>     # Explicitly include Teensy CAN library
