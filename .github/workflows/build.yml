name: Build OnStepX Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # You can add 'teensy41' or other environments here as you expand
        environment: [esp32]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Build Firmware
      run: pio run -e ${{ matrix.environment }}

    - name: Prepare Artifact Files
      run: |
        mkdir -p release_files
        cp .pio/build/${{ matrix.environment }}/firmware.bin release_files/
        # Also copy the bootloader and partitions (these names vary slightly by framework, but usually live here)
        cp .pio/build/${{ matrix.environment }}/bootloader.bin release_files/ || true
        cp .pio/build/${{ matrix.environment }}/partitions.bin release_files/ || true

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.environment }}
        path: release_files/*
        if-no-files-found: error
