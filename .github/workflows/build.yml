name: Build OnStepX Firmware

on:
  push:
    branches: [ "**" ] # Runs on every push to ANY branch
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Add all environments you want to build for here
        environment: [esp32, teensy41]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Build Firmware
      run: pio run -e ${{ matrix.environment }}

    - name: Prepare Artifact Files
      run: |
        mkdir -p release_files
        if [ "${{ matrix.environment }}" == "esp32" ]; then
          cp .pio/build/esp32/merged-firmware.bin release_files/firmware-factory.bin
          echo "OnStepX Firmware (ESP32)" > release_files/Instructions.txt
        elif [ "${{ matrix.environment }}" == "teensy41" ]; then
          cp .pio/build/teensy41/firmware.hex release_files/firmware.hex
          echo "OnStepX Firmware (Teensy)" > release_files/Instructions.txt
        fi
        
        # Common instructions for all artifacts
        echo "===================================" >> release_files/Instructions.txt
        echo "" >> release_files/Instructions.txt
        echo "To flash this firmware, please visit the official Web Tools page:" >> release_files/Instructions.txt
        echo "https://graydigitalarts.com/OnStep-Web-Tools/custom-flasher.html" >> release_files/Instructions.txt

    - name: Add Job Summary
      run: |
        echo "### 🎉 Firmware Successfully Built!" >> $GITHUB_STEP_SUMMARY
        echo "Your custom firmware for **${{ matrix.environment }}** is ready." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### How to flash:" >> $GITHUB_STEP_SUMMARY
        echo "1. Download the **firmware-${{ matrix.environment }}** artifact below and extract the \`.zip\` file." >> $GITHUB_STEP_SUMMARY
        if [ "${{ matrix.environment }}" == "esp32" ]; then
          echo "2. Go to the [OnStepX Web Flasher](https://graydigitalarts.com/OnStep-Web-Tools/custom-flasher.html)." >> $GITHUB_STEP_SUMMARY
          echo "3. Select the \`firmware-factory.bin\` file and click **Connect and Flash**." >> $GITHUB_STEP_SUMMARY
        elif [ "${{ matrix.environment }}" == "teensy41" ]; then
          echo "2. Use the [Teensy Loader application](https://www.pjrc.com/teensy/loader.html) to open and flash the \`firmware.hex\` file." >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.environment }}
        path: release_files/*
        if-no-files-found: error
