name: Build OnStepX Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # You can add 'teensy41' or other environments here as you expand
        environment: [esp32]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Build Firmware
      run: pio run -e ${{ matrix.environment }}

    - name: Prepare Artifact Files
      run: |
        mkdir -p release_files
        cp .pio/build/${{ matrix.environment }}/merged-firmware.bin release_files/firmware-factory.bin
        
        # Create an instructions file for the user
        echo "OnStepX Firmware Successfully Built!" > release_files/Instructions.txt
        echo "===================================" >> release_files/Instructions.txt
        echo "" >> release_files/Instructions.txt
        echo "To flash this firmware to your ESP32, please visit the official Web Tools page:" >> release_files/Instructions.txt
        echo "https://graydigitalarts.com/OnStep-Web-Tools/custom-flasher.html" >> release_files/Instructions.txt
        echo "" >> release_files/Instructions.txt
        echo "Select the 'firmware-factory.bin' file included in this folder to upload it to your MCU." >> release_files/Instructions.txt

    - name: Add Job Summary
      run: |
        echo "### 🎉 Firmware Successfully Built!" >> $GITHUB_STEP_SUMMARY
        echo "Your custom firmware for **${{ matrix.environment }}** is ready." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### How to flash your ESP32:" >> $GITHUB_STEP_SUMMARY
        echo "1. Download the **firmware-${{ matrix.environment }}** artifact below and extract the \`.zip\` file." >> $GITHUB_STEP_SUMMARY
        echo "2. Go to the [OnStepX Web Flasher](https://graydigitalarts.com/OnStep-Web-Tools/custom-flasher.html)." >> $GITHUB_STEP_SUMMARY
        echo "3. Select the \`firmware-factory.bin\` file and click **Connect and Flash**." >> $GITHUB_STEP_SUMMARY

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.environment }}
        path: release_files/*
        if-no-files-found: error
