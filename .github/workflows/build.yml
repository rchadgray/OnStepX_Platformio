name: Build OnStepX Firmware

on:
  push:
    branches: [ "**" ] # Runs on every push to ANY branch
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub UI

jobs:
  # This first job determines which MCU to build for based on the PINMAP setting.
  determine_mcu:
    runs-on: ubuntu-latest
    outputs:
      mcu_target: ${{ steps.check_pinmap.outputs.mcu }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Check PINMAP setting in Config.h
        id: check_pinmap
        run: |
          if grep -E -q "^#define PINMAP[[:space:]]*(MaxPCB4|MiniPCB|MiniPCB2)" src/Config.h; then
            echo "Target MCU is Teensy"
            echo "mcu=teensy" >> $GITHUB_OUTPUT
          elif grep -q "^#define PINMAP[[:space:]]*MaxESP4" src/Config.h; then
            echo "Target MCU is ESP32"
            echo "mcu=esp32" >> $GITHUB_OUTPUT
          else
            echo "No specific MCU target found, skipping builds."
            echo "mcu=none" >> $GITHUB_OUTPUT
          fi

  # This job will ONLY run if the 'determine_mcu' job outputs 'esp32'
  build_esp32:
    needs: determine_mcu
    if: needs.determine_mcu.outputs.mcu_target == 'esp32'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
      - name: Build ESP32 Firmware
        run: pio run -e esp32
      - name: Prepare Artifact Files
        run: |
          mkdir -p release_files
          cp .pio/build/esp32/merged-firmware.bin release_files/firmware-factory.bin
      - name: Add Job Summary
        run: |
          echo "### 🎉 Firmware Successfully Built!" >> $GITHUB_STEP_SUMMARY
          echo "Your custom firmware for **ESP32** is ready." >> $GITHUB_STEP_SUMMARY
          echo "2. Go to the [OnStepX Web Flasher](https://graydigitalarts.com/OnStep-Web-Tools/custom-flasher.html)." >> $GITHUB_STEP_SUMMARY
          echo "3. Select the \`firmware-factory.bin\` file and click **Connect and Flash**." >> $GITHUB_STEP_SUMMARY
      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: release_files/*
          if-no-files-found: error

  # This job will ONLY run if the 'determine_mcu' job outputs 'teensy'
  build_teensy:
    needs: determine_mcu
    if: needs.determine_mcu.outputs.mcu_target == 'teensy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
      - name: Build Teensy Firmware
        run: pio run -e teensy41
      - name: Prepare Artifact Files
        run: |
          mkdir -p release_files
          cp .pio/build/teensy41/firmware.hex release_files/firmware.hex
      - name: Add Job Summary
        run: |
          echo "### 🎉 Firmware Successfully Built!" >> $GITHUB_STEP_SUMMARY
          echo "Your custom firmware for **Teensy** is ready." >> $GITHUB_STEP_SUMMARY
          echo "2. Use the [Teensy Loader application](https://www.pjrc.com/teensy/loader.html) to open and flash the \`firmware.hex\` file." >> $GITHUB_STEP_SUMMARY
      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-teensy41
          path: release_files/*
          if-no-files-found: error
