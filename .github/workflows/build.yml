name: Build OnStepX Firmware

on:
  repository_dispatch:
    types: [build-onstepx]
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  DOWNLOAD_URL_BASE: 'https://GrayDigitalArts.com/OnStepX-Builder/?url='
  DOWNLOAD_URL_BASE_TEENSY: 'https://GrayDigitalArts.com/OnStepX-Builder/bin/'

jobs:
  determine_mcu:
    runs-on: ubuntu-latest
    outputs:
      mcu_target: ${{ steps.check_pinmap.outputs.mcu }}
      pinmap_name: ${{ steps.check_pinmap.outputs.pinmap }}
      animal_name: ${{ steps.generate_name.outputs.animal_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Config Files from Web UI Payload
        if: github.event_name == 'repository_dispatch'
        env:
          CONFIG_H_CONTENT: ${{ github.event.client_payload.config_h }}
          EXTENDED_CONFIG_H_CONTENT: ${{ github.event.client_payload.extended_config_h }}
        run: |
          echo "Creating configuration files from dispatch payload..."
          echo "$CONFIG_H_CONTENT" > src/Config.h
          if [[ -n "$EXTENDED_CONFIG_H_CONTENT" ]]; then
            echo "$EXTENDED_CONFIG_H_CONTENT" > src/extended.config.h
            echo "extended.config.h created."
          fi
          echo "Config.h created."

      - name: Check PINMAP setting in Config.h
        id: check_pinmap
        run: |
          # Extract PINMAP name
          PINMAP=$(grep "^#define PINMAP" src/Config.h | awk '{print $3}')
          echo "pinmap=$PINMAP" >> $GITHUB_OUTPUT
          
          if grep -E -q "^#define PINMAP[[:space:]]*(MaxPCB4|MiniPCB|MiniPCB2)" src/Config.h; then
            echo "Target MCU is Teensy"
            echo "mcu=teensy" >> $GITHUB_OUTPUT
          elif grep -q "^#define PINMAP[[:space:]]*MaxESP4" src/Config.h; then
            echo "Target MCU is ESP32"
            echo "mcu=esp32" >> $GITHUB_OUTPUT
          else
            echo "No specific MCU target found, skipping builds."
            echo "mcu=none" >> $GITHUB_OUTPUT
          fi

      - name: Generate Random Adjective-Animal Name
        id: generate_name
        run: |
          ADJECTIVES=("swift" "bright" "mighty" "quick" "brave" "clever" "bold" "keen" "nimble" "fierce" "sleek" "wild" "smart" "strong" "sharp" "swift" "brilliant" "cosmic" "dancing" "electric" "fantastic" "glowing" "hidden" "icy" "jolly")
          ANIMALS=("eagle" "tiger" "phoenix" "dragon" "wolf" "falcon" "lion" "cobra" "shark" "panda" "otter" "lynx" "raven" "fox" "elk" "stag" "viper" "mantis" "owl" "hare")
          
          RANDOM_ADJ=${ADJECTIVES[$((RANDOM % ${#ADJECTIVES[@]}))]}
          RANDOM_ANIMAL=${ANIMALS[$((RANDOM % ${#ANIMALS[@]}))]}
          ANIMAL_NAME="$RANDOM_ADJ-$RANDOM_ANIMAL"
          
          echo "animal_name=$ANIMAL_NAME" >> $GITHUB_OUTPUT
          echo "Generated firmware name: $ANIMAL_NAME"

  build_esp32:
    needs: determine_mcu
    if: needs.determine_mcu.outputs.mcu_target == 'esp32'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Config Files from Web UI Payload
        if: github.event_name == 'repository_dispatch'
        env:
          CONFIG_H_CONTENT: ${{ github.event.client_payload.config_h }}
          EXTENDED_CONFIG_H_CONTENT: ${{ github.event.client_payload.extended_config_h }}
        run: |
          echo "Creating configuration files from dispatch payload..."
          echo "$CONFIG_H_CONTENT" > src/Config.h
          if [[ -n "$EXTENDED_CONFIG_H_CONTENT" ]]; then
            echo "$EXTENDED_CONFIG_H_CONTENT" > src/extended.config.h
            echo "extended.config.h created."
          fi
          echo "Config.h created."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
      - name: Build ESP32 Firmware
        run: pio run -e esp32
      - name: Prepare Artifact Files
        run: |
          mkdir -p release_files
          FIRMWARE_NAME="${{ needs.determine_mcu.outputs.animal_name }}-factory.bin"
          echo "FIRMWARE_NAME=$FIRMWARE_NAME" >> $GITHUB_ENV
          cp .pio/build/esp32/merged-firmware.bin "release_files/$FIRMWARE_NAME"
      - name: Add Job Summary
        run: |
          echo "### 🎉 Firmware Successfully Built!" >> $GITHUB_STEP_SUMMARY
          echo "Your custom firmware for **ESP32** is ready." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### How to flash:" >> $GITHUB_STEP_SUMMARY
          echo "1. **Download the artifact** named \`firmware-esp32\` below. It may take a moment for the file to appear." >> $GITHUB_STEP_SUMMARY
          echo '```diff' >> $GITHUB_STEP_SUMMARY
          echo '- Note: If you do not see the artifact download link, please refresh this page.' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "2. Go to the [OnStepX Web Flasher](https://graydigitalarts.com/OnStep-Web-Tools/custom-flasher.html)." >> $GITHUB_STEP_SUMMARY
          echo "3. Select the \`firmware-factory.bin\` file (from the .zip) and click **Connect and Flash**." >> $GITHUB_STEP_SUMMARY
      - name: Securely copy file to web server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2233 # Custom SSH port
          source: "release_files/${{ needs.determine_mcu.outputs.animal_name }}-factory.bin"
          target: "${{ secrets.REMOTE_PATH }}"
          strip_components: 1

      - name: Update Job Summary with Public URL
        run: |
          FIRMWARE_NAME="${{ needs.determine_mcu.outputs.animal_name }}-factory.bin"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Public Download" >> $GITHUB_STEP_SUMMARY
          echo "Your firmware has been uploaded to the OnStepX Web Tools site." >> $GITHUB_STEP_SUMMARY
          echo "**[Click here to download $FIRMWARE_NAME](${{ env.DOWNLOAD_URL_BASE }}$FIRMWARE_NAME)**" >> $GITHUB_STEP_SUMMARY

  build_teensy:
    needs: determine_mcu
    if: needs.determine_mcu.outputs.mcu_target == 'teensy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Config Files from Web UI Payload
        if: github.event_name == 'repository_dispatch'
        env:
          CONFIG_H_CONTENT: ${{ github.event.client_payload.config_h }}
          EXTENDED_CONFIG_H_CONTENT: ${{ github.event.client_payload.extended_config_h }}
        run: |
          echo "Creating configuration files from dispatch payload..."
          echo "$CONFIG_H_CONTENT" > src/Config.h
          if [[ -n "$EXTENDED_CONFIG_H_CONTENT" ]]; then
            echo "$EXTENDED_CONFIG_H_CONTENT" > src/extended.config.h
            echo "extended.config.h created."
          fi
          echo "Config.h created."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
      - name: Build Teensy Firmware
        run: pio run -e teensy41
      - name: Prepare Artifact Files
        run: |
          mkdir -p release_files
          FIRMWARE_NAME="${{ needs.determine_mcu.outputs.animal_name }}-firmware.hex"
          echo "FIRMWARE_NAME=$FIRMWARE_NAME" >> $GITHUB_ENV
          cp .pio/build/teensy41/firmware.hex "release_files/$FIRMWARE_NAME"
      - name: Add Job Summary
        run: |
          echo "### 🎉 Firmware Successfully Built!" >> $GITHUB_STEP_SUMMARY
          echo "Your custom firmware for **Teensy** is ready." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### How to flash:" >> $GITHUB_STEP_SUMMARY
          echo "1. **Download the artifact** named \`firmware-teensy41\` below. It may take a moment for the file to appear." >> $GITHUB_STEP_SUMMARY
          echo '```diff' >> $GITHUB_STEP_SUMMARY
          echo '- Note: If you do not see the artifact download link, please refresh this page.' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "2. Use the [Teensy Loader application](https://www.pjrc.com/teensy/loader.html) to open and flash the \`firmware.hex\` file (from the .zip)." >> $GITHUB_STEP_SUMMARY
      - name: Securely copy file to web server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2233 # Custom SSH port
          source: "release_files/${{ needs.determine_mcu.outputs.animal_name }}-firmware.hex"
          target: "${{ secrets.REMOTE_PATH }}"
          strip_components: 1

      - name: Update Job Summary with Public URL
        run: |
          FIRMWARE_NAME="${{ needs.determine_mcu.outputs.animal_name }}-firmware.hex"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Public Download" >> $GITHUB_STEP_SUMMARY
          echo "Your firmware has been uploaded to the OnStepX Web Tools site." >> $GITHUB_STEP_SUMMARY
          echo "**[Click here to download $FIRMWARE_NAME](${{ env.DOWNLOAD_URL_BASE_TEENSY }}$FIRMWARE_NAME)**" >> $GITHUB_STEP_SUMMARY